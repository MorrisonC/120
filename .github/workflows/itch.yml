name: Build and Deploy to Itch.io

on:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: game
  EXPORT_NAME: index

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Web Build
        run: |
          mkdir -v -p build/web
          cd $PROJECT_PATH
          godot --headless -v --export-release "Web" ../build/web/$EXPORT_NAME.html

      - name: Patch Web Build for Playwright
        run: |
          cd build/web
          sed -i 's/canvas.getContext("webgl2", {/canvas.getContext("webgl2", {preserveDrawingBuffer: true, /' $EXPORT_NAME.js
          sed -i 's/canvas.getContext("webgl", {/canvas.getContext("webgl", {preserveDrawingBuffer: true, /' $EXPORT_NAME.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  deploy-itch:
    name: Deploy to Itch.io
    needs: export-web
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Deploy to Itch.io
        run: butler push build/web pionee/120:web
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
